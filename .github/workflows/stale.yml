name: Stale repos

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          python3 scripts/stale.py README.md > stale.md
          if [ -s stale.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: open
        run: echo "number=$(gh issue list --repo "$GITHUB_REPOSITORY" --author app/github-actions --label unmaintained --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.check.outputs.found
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Unmaintained repos
          content-filepath: stale.md
          issue-number: ${{ steps.open.outputs.number }}
          labels: unmaintained, good first issue
