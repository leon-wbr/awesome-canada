name: PR checks

on:
  pull_request:

permissions: {}

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes awesome-lint@2.3.0

  new-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          git diff --unified=0 "origin/$BASE_REF...HEAD" -- README.md | sed -n 's/^+\([^+]\)/\1/p' > added.md
          echo "lines=$(wc -l < added.md)" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: steps.diff.outputs.lines != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress added.md
          failIfEmpty: false
